name: Synchroniser les rendements de marché
on:
  schedule:
    # Toutes les heures à :30, de 07:30 à 17:30 UTC.
    # Cela couvre 09:30–18:30 à Paris en hiver (UTC+1) et 09:30–19:30 en été (UTC+2).
    # La fenêtre exacte n'a pas besoin d'être parfaite : la notification n'est
    # affichée qu'une fois par jour côté service worker.
    - cron: '30 7-17 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Synchroniser les clôtures et les performances sur 365 jours
        run: npm run market:sync
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          MARKET_SYNC_TOKEN: ${{ secrets.MARKET_SYNC_TOKEN }}
          PUSH_SYNC_TOKEN: ${{ secrets.PUSH_SYNC_TOKEN }}
          PUSH_NOTIFICATIONS_ENABLED: 'true'
          VAPID_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
