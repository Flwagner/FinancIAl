name: Synchroniser les rendements de marché
on:
  schedule:
    # Tous les jours à 09:30 et 14:00 en France, changement d'heure été/hiver inclus.
    - cron: '30 9 * * *'
      timezone: 'Europe/Paris'
    - cron: '0 14 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Synchroniser les clôtures et les performances sur 365 jours
        run: npm run market:sync
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          MARKET_SYNC_TOKEN: ${{ secrets.MARKET_SYNC_TOKEN }}
